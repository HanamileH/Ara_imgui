[project]
name = "Ara_imgui"
version = "2.0.0"
description = "A simplified wrapper for Dear ImGui and GLFW"
readme = "README.md"
authors = [{ name = "HanamileH", email = "hanamileh@gmail.com" }]
license = "MIT"

dependencies = [
   "imgui_bundle>=1.92.0",
]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/hanamileh/Ara_imgui"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"